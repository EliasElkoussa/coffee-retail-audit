<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Al Gahwa Al Arabiya — Concept Storefront</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --roast:#2A1710; --bean:#4A2C20; --cardamom:#5E7349; --saffron:#C2861A;
  --paper:#FAFAF7; --card:#FFFFFF; --line:#E4E0D8; --muted:#6F655C;
  --radius-s:6px; --radius-l:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--paper);color:var(--roast);font:16px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
h1,h2,h3{font-family:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;line-height:1.2;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* concept ribbon */
.ribbon{background:var(--saffron);color:var(--roast);font-size:14px;padding:8px 0}
.ribbon .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ribbon a{font-weight:600}

/* header */
header.site{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar{display:flex;align-items:center;gap:16px;height:72px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{width:44px;height:44px;border-radius:var(--radius-s)}
.logo span{font-family:"Reem Kufi";font-weight:700;font-size:18px;letter-spacing:.01em}
nav.main{display:flex;gap:4px;margin-inline-start:auto}
nav.main a{padding:8px 12px;border-radius:var(--radius-s);text-decoration:none;font-weight:500}
nav.main a:hover,nav.main a[aria-current="page"]{background:#F1EEE8}
.tools{display:flex;gap:8px;align-items:center}
.lang{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600}
.cartbtn{position:relative;border:0;background:var(--bean);color:#fff;border-radius:999px;padding:8px 16px;font-weight:600}
.cartbtn b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--saffron);color:var(--roast);font-size:13px;margin-inline-start:6px}
.menu-toggle{display:none;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-s);padding:8px 10px}
@media (max-width:860px){
  nav.main{display:none;position:absolute;top:72px;inset-inline:0;background:var(--card);flex-direction:column;padding:12px 20px;border-bottom:1px solid var(--line)}
  nav.main.open{display:flex}
  .menu-toggle{display:block;margin-inline-start:auto}
  .logo span{display:none}
}

/* hero */
.hero{background:var(--bean);color:#F5EFE8;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding-top:48px;padding-bottom:48px}
.hero .tag{font-family:"Reem Kufi";font-size:22px;color:#E9C98C;margin:0 0 12px}
.hero h1{font-size:clamp(34px,5vw,58px);font-weight:700}
.hero p.lead{font-size:18px;max-width:46ch;color:#E6DCD1;margin:18px 0 26px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;border:0;border-radius:999px;padding:12px 22px;font-weight:600;text-decoration:none}
.btn.primary{background:var(--saffron);color:var(--roast)}
.btn.ghost{background:transparent;color:#F5EFE8;border:1px solid #8C6B5B}
.btn.dark{background:var(--bean);color:#fff}
.hero figure{margin:0;background:#fff;border-radius:var(--radius-l);padding:18px;position:relative}
.hero figure img{aspect-ratio:1/1;object-fit:contain;width:100%}
.hero figcaption{color:var(--roast);display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-top:8px}
.hero figcaption strong{font-family:"Reem Kufi";font-size:18px}
.sold{font-size:14px;color:var(--cardamom);font-weight:600}
@media (max-width:760px){.hero .wrap{grid-template-columns:1fr}.hero figure{max-width:360px}}

/* trust strip */
.strip{background:var(--card);border-bottom:1px solid var(--line)}
.strip ul{list-style:none;margin:0;padding:14px 0;display:flex;gap:28px;flex-wrap:wrap;font-size:15px}
.strip li{display:flex;gap:8px;align-items:center}
.strip svg{flex:none}
.todo{color:var(--muted);font-style:italic}

section.block{padding:52px 0}
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head h2{font-size:30px}
.head a{font-weight:600}

/* categories */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-l);text-decoration:none;overflow:hidden;display:flex;flex-direction:column}
.cat img{aspect-ratio:1/1;object-fit:cover;width:100%}
.cat span{padding:12px 14px;font-family:"Reem Kufi";font-size:18px}
.cat:hover{border-color:var(--bean)}
@media (max-width:760px){.cats{grid-template-columns:repeat(2,1fr)}}

/* products */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media (max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:680px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
.p{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-l);display:flex;flex-direction:column;overflow:hidden}
.p a.img{display:block;background:#fff;padding:12px}
.p img{aspect-ratio:1/1;object-fit:contain;width:100%}
.p .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.p h3{font-size:17px;font-weight:600}
.p h3 a{text-decoration:none}
.p .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto;padding-top:6px}
.price{font-weight:600}
.add{border:1px solid var(--bean);background:transparent;color:var(--bean);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.add:hover{background:var(--bean);color:#fff}

/* gifts band */
.gift{background:#EEF0E8;border-radius:var(--radius-l);display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.gift .txt{padding:36px}
.gift h2{font-size:30px;margin-bottom:10px}
.gift img{width:100%;height:100%;object-fit:cover;min-height:260px}
@media (max-width:760px){.gift{grid-template-columns:1fr}}

/* branches */
.branches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;list-style:none;padding:0;margin:0}
.branches li{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px}
.branches small{display:block;color:var(--muted)}
@media (max-width:760px){.branches{grid-template-columns:repeat(2,1fr)}}

/* category page */
.crumbs{font-size:14px;color:var(--muted);padding:20px 0 0}
.crumbs a{color:var(--muted)}
.catbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:18px 0 22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px}
.chip[aria-pressed="true"]{background:var(--bean);color:#fff;border-color:var(--bean)}
select{font:inherit;border:1px solid var(--line);border-radius:var(--radius-s);padding:8px 10px;background:var(--card)}

/* product page */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:24px 0 40px}
.pd .gal{background:#fff;border:1px solid var(--line);border-radius:var(--radius-l);padding:24px}
.pd .gal img{aspect-ratio:1/1;object-fit:contain;width:100%}
.pd h1{font-size:clamp(30px,4vw,44px)}
.pd .sub{color:var(--muted);margin:6px 0 14px}
.pd .price{font-size:26px;display:block;margin:10px 0 18px}
fieldset{border:0;padding:0;margin:0 0 18px}
legend{font-weight:600;margin-bottom:8px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts label{border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 14px;cursor:pointer;background:var(--card)}
.opts input{position:absolute;opacity:0}
.opts input:checked+span{font-weight:600}
.opts label:has(input:checked){border-color:var(--bean);box-shadow:inset 0 0 0 1px var(--bean)}
.opts label:has(input:focus-visible){outline:3px solid var(--saffron)}
.buy{display:flex;gap:10px;align-items:center;margin-bottom:22px}
.qty{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.qty button{border:0;background:var(--card);width:40px}
.qty output{width:36px;display:grid;place-items:center}
.info{border-top:1px solid var(--line)}
.info div{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.info dt{font-weight:600;min-width:120px}
.info dd{margin:0}
.slot{border:1px dashed #BFB6A8;border-radius:var(--radius-s);padding:14px;color:var(--muted);background:#FCFBF8}
.slot strong{color:var(--roast)}
.reviews{padding:10px 0 50px}
@media (max-width:820px){.pd{grid-template-columns:1fr;gap:20px}}

footer{background:var(--roast);color:#D9CFC5;padding:40px 0;margin-top:20px}
footer .tagline{font-family:"Reem Kufi";font-size:24px;color:#F5EFE8}
footer .pay{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
footer .pay span{border:1px solid #5A463C;border-radius:var(--radius-s);padding:4px 10px;font-size:14px}

.toast{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--roast);color:#fff;padding:12px 18px;border-radius:999px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
[hidden]{display:none!important}
</style>
</head>

  sort:'الترتيب',sortBest:'الأكثر مبيعاً',sortLow:'السعر: من الأقل',sortHigh:'السعر: من الأعلى',all:'الكل',under90:'أقل من 90 درهم',over90:'90 درهم فأكثر',
  results:n=>`${n.toLocaleString('ar-EG')} منتجات`,
  pdSub:'خلطة قهوة عربية',size:'اختر الخلطة',qty:'الكمية',
  deliv:'التوصيل',delivV:'الرسوم والمدة حسب الإمارة: تؤكدها العلامة',pay:'الدفع',payV:'Apple Pay وفيزا وماستركارد وأمريكان إكسبريس والدفع عند الاستلام',pts:'المكافآت',ptsV:'اكسب نقاط ولاء مع هذا الطلب',
  descH:'عن هذه القهوة',descSlot:'<strong>الوصف يُزوَّد من العلامة.</strong> المحتوى المقترح: مصدر البن، درجة التحميص، الطحنة، عدد الفناجين لكل كيلو، نسبة التحضير، والفرق بين نسخة الهيل ونسخة الزعفران.',
  revH:'آراء العملاء',revSlot:'<strong>لا توجد تقييمات منشورة بعد.</strong> هذا المكان مخصص لتقييمات المشترين الموثّقة بعد بدء جمعها عقب التوصيل.',
  similar:'قد يعجبك أيضاً',
  tagline:'لا تُدركه الكفّ، بل تُدركه الروح',tagEn:'شعار العلامة.',cod:'الدفع عند الاستلام',
  footnote:'نموذج تصوّري من إعداد إلياس الكوسا للنقاش فقط. المحتوى والصور ملك القهوة العربية.',cur:'درهم'}
};

let lang='en', cart=0, sortMode='best', band='all', opt=0, qty=1;
const $=s=>document.querySelector(s);
const t=k=>T[lang][k];
const nm=p=>lang==='en'?p.en:p.ar;
const money=n=>lang==='en'?`AED ${n.toFixed(2)}`:`${n.toLocaleString('ar-EG',{minimumFractionDigits:2})} درهم`;

function card(p){
  return `<article class="p">
    <a class="img" href="#product" aria-label="${nm(p)}"><img loading="lazy" src="${IMG(p.img,500)}" alt="${nm(p)}"></a>
    <div class="body">
      <h3><a href="${p.id==='kaif'?'#product':'#category'}">${nm(p)}</a></h3>
      ${p.sold?`<span class="sold">${t('soldN')(p.sold)}</span>`:''}
      <div class="meta"><span class="price">${money(p.price)}</span><button class="add" data-add>${t('add')}</button></div>
    </div></article>`;
}
const strip=()=>`<div class="strip"><div class="wrap"><ul>
  <li>${ico('card')}${t('s1')}</li><li class="todo">${ico('truck')}${t('s2')}</li><li>${ico('star')}${t('s3')}</li></ul></div></div>`;
function ico(n){const d={card:'M3 6h18v12H3zM3 10h18',truck:'M3 7h11v9H3zM14 10h4l3 3v3h-7M7 19a1.5 1.5 0 1 0 0-.1M17 19a1.5 1.5 0 1 0 0-.1',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z'}[n];
  return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="${d}"/></svg>`;}

function home(){
  const kaif=P[0], best=[...P].filter(p=>p.sold).sort((a,b)=>b.sold-a.sold).slice(0,4);
  return `
  <section class="hero"><div class="wrap">
    <div>
      <p class="tag" lang="ar">${t('heroTag')}</p>
      <h1>${t('heroH')}</h1>
      <p class="lead">${t('heroP')}</p>
      <div class="ctas"><a class="btn primary" href="#category">${t('shopArabic')}</a><a class="btn ghost" href="#home-gifts">${t('shopGifts')}</a></div>
    </div>
    <figure><a href="#product"><img src="${IMG(kaif.img,800)}" alt="${nm(kaif)}"></a>
      <figcaption><span><span class="sold">${t('bestseller')}</span><br><strong>${nm(kaif)}</strong></span><span class="price">${money(kaif.price)}</span></figcaption></figure>
  </div></section>
  ${strip()}
  <section class="block"><div class="wrap">
    <div class="head"><h2>${t('shopCat')}</h2></div>
    <div class="cats">${CATS.map(c=>`<a class="cat" href="${c.href}"><img loading="lazy" src="${IMG(c.img,400)}" alt=""><span>${lang==='en'?c.en:c.ar}</span></a>`).join('')}</div>
  </div></section>
  <section class="block" style="padding-top:0"><div class="wrap">
    <div class="head"><div><h2>${t('best')}</h2><p style="margin:4px 0 0;color:var(--muted)">${t('bestNote')}</p></div><a href="#category">${t('seeAll')}</a></div>
    <div class="grid">${best.map(card).join('')}</div>
  </div></section>
  <section class="block" id="home-specialty" style="padding-top:0"><div class="wrap">
    <div class="head"><h2>${t('specialty')}</h2></div>
    <div class="grid">${P.filter(p=>p.cat==='specialty').map(card).join('')}</div>
  </div></section>
  <section class="block" id="home-gifts" style="padding-top:0"><div class="wrap">
    <div class="gift"><div class="txt"><h2>${t('giftH')}</h2><p>${t('giftP')}</p><a class="btn dark" href="#home-gifts">${t('giftCta')}</a></div>
    <img loading="lazy" src="${IMG('995a3ec4-ade8-4544-91e5-17a2334308fe-260x260.jpg',700)}" alt=""></div>
  </div></section>
  <section class="block" id="home-tools" style="padding-top:0"><div class="wrap">
    <div class="head"><h2>${t('tools')}</h2></div>
    <div class="grid">${P.filter(p=>p.cat==='tools').slice(0,4).map(card).join('')}</div>
  </div></section>
  <section class="block" id="home-branches" style="padding-top:0"><div class="wrap">
    <div class="head"><h2>${t('branches')}</h2></div>
    <ul class="branches">${BR.map(b=>`<li>${lang==='en'?b[0]:b[1]}</li>`).join('')}</ul>
  </div></section>`;
}

function category(){
  let list=P.filter(p=>p.cat==='arabic');
  if(band==='under')list=list.filter(p=>p.price<90); if(band==='over')list=list.filter(p=>p.price>=90);
  list.sort(sortMode==='low'?(a,b)=>a.price-b.price:sortMode==='high'?(a,b)=>b.price-a.price:(a,b)=>b.sold-a.sold);
  return `<div class="wrap">
    <p class="crumbs"><a href="#home">${t('crumbsHome')}</a> / ${t('catTitle')}</p>
    <h1 style="font-size:40px;margin-top:10px">${t('catTitle')}</h1>
    <p style="max-width:60ch;color:var(--muted)">${t('catIntro')}</p>
    <div class="catbar">
      <div class="chips" role="group">${['all','under','over'].map(b=>`<button class="chip" data-band="${b}" aria-pressed="${band===b}">${t(b==='all'?'all':b==='under'?'under90':'over90')}</button>`).join('')}</div>
      <label>${t('sort')} <select id="sort"><option value="best">${t('sortBest')}</option><option value="low">${t('sortLow')}</option><option value="high">${t('sortHigh')}</option></select></label>
    </div>
    <p style="color:var(--muted);margin:0 0 12px">${t('results')(list.length)}</p>
    <div class="grid">${list.map(card).join('')}</div>
  </div>${strip()}`;
}

function product(){
  const p=P[0], o=KAIF_OPTS[opt];
  return `<div class="wrap">
    <p class="crumbs"><a href="#home">${t('crumbsHome')}</a> / <a href="#category">${t('catTitle')}</a> / ${nm(p)}</p>
    <div class="pd">
      <div class="gal"><img src="${IMG(p.img,900)}" alt="${nm(p)}"></div>
      <div>
        <span class="sold">${t('bestseller')} · ${t('soldN')(p.sold)}</span>
        <h1>${nm(p)}</h1>
        <p class="sub">${t('pdSub')}</p>
        <span class="price" id="pprice">${money(o.price)}</span>
        <fieldset><legend>${t('size')}</legend><div class="opts">
          ${KAIF_OPTS.map((x,i)=>`<label><input type="radio" name="opt" value="${i}" ${i===opt?'checked':''}><span>${lang==='en'?x.en:x.ar}</span></label>`).join('')}
        </div></fieldset>
        <div class="buy"><div class="qty" aria-label="${t('qty')}"><button data-q="-1" aria-label="−">−</button><output id="q">${qty}</output><button data-q="1" aria-label="+">+</button></div>
          <button class="btn dark" data-add>${t('add')}</button></div>
        <dl class="info">
          <div><dt>${t('deliv')}</dt><dd class="todo">${t('delivV')}</dd></div>
          <div><dt>${t('pay')}</dt><dd>${t('payV')}</dd></div>
          <div><dt>${t('pts')}</dt><dd>${t('ptsV')}</dd></div>
        </dl>
      </div>
    </div>
    <section style="padding-bottom:30px"><h2 style="font-size:26px;margin-bottom:12px">${t('descH')}</h2><div class="slot">${t('descSlot')}</div></section>
    <section class="reviews"><h2 style="font-size:26px;margin-bottom:12px">${t('revH')}</h2><div class="slot">${t('revSlot')}</div></section>
    <section style="padding-bottom:50px"><div class="head"><h2>${t('similar')}</h2></div>
      <div class="grid">${P.filter(x=>x.cat==='arabic'&&x.id!=='kaif').slice(0,4).map(card).join('')}</div></section>
  </div>`;
}

function render(scroll=true){
  document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  $('#lang').textContent=lang==='en'?'العربية':'English';
  const h=(location.hash||'#home').slice(1);
  const page=h.startsWith('category')?'category':h.startsWith('product')?'product':'home';
  $('#view').innerHTML=page==='category'?category():page==='product'?product():home();
  document.querySelectorAll('nav.main a').forEach((a,i)=>a.toggleAttribute('aria-current',page==='category'&&i===0));
  if(page==='category'){const s=$('#sort');s.value=sortMode;s.onchange=()=>{sortMode=s.value;render(false)};}
  if(!scroll)return;
  if(h.startsWith('home-')){const el=document.getElementById(h);el&&el.scrollIntoView();}
  else window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-add]')){cart+=e.target.closest('.pd')?qty:1;$('#count').textContent=cart;toast(t('added'));}
  const b=e.target.closest('[data-band]'); if(b){band=b.dataset.band;render(false);}
  const q=e.target.closest('[data-q]'); if(q){qty=Math.max(1,qty+ +q.dataset.q);$('#q').textContent=qty;}
});
document.addEventListener('change',e=>{if(e.target.name==='opt'){opt=+e.target.value;$('#pprice').textContent=money(KAIF_OPTS[opt].price);}});
$('#lang').onclick=()=>{const y=scrollY;lang=lang==='en'?'ar':'en';render(false);window.scrollTo({top:y,behavior:'instant'});};
$('#cartbtn').onclick=()=>toast(t('added'));
const mt=document.querySelector('.menu-toggle');
mt.onclick=()=>{const n=$('#nav');n.classList.toggle('open');mt.setAttribute('aria-expanded',n.classList.contains('open'));};
$('#nav').addEventListener('click',()=>{$('#nav').classList.remove('open');mt.setAttribute('aria-expanded','false');});
let tt;function toast(m){const x=$('#toast');x.textContent=m;x.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>x.classList.remove('show'),2600);}
window.addEventListener('hashchange',()=>render(true));
render();
</script>
</body>
</html>
